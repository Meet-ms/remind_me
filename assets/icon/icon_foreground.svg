<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>
    <g id="bell-shape">
      <circle cx="512" cy="250" r="36"/>
      <path d="M512 280 C400 280 340 370 340 490 L340 600 C340 640 310 670 270 700 L270 730 L754 730 L754 700 C714 670 684 640 684 600 L684 490 C684 370 624 280 512 280 Z"/>
